<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>四年級擴寫小作家</title><style>
*{box-sizing:border-box}body{margin:0;font-family:"Microsoft JhengHei",sans-serif;background:#f4f8ff;color:#24324a}header{background:linear-gradient(135deg,#3978d3,#51aa78);color:#fff;text-align:center;padding:18px}h1{margin:0}.wrap{max-width:980px;margin:auto;padding:15px}.card{background:#fff;margin:14px 0;padding:19px;border-radius:18px;box-shadow:0 5px 18px #2342 0}.core{font-size:25px;font-weight:bold;background:#fff1c8;color:#8b5019;padding:15px;border-radius:12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}.opt,button{font:inherit;border-radius:12px;padding:12px;cursor:pointer}.opt{border:2px solid #cbd8eb;background:#fff;text-align:left}.opt:hover{background:#eef6ff;border-color:#4d85d2}.bad{border-color:#d74f4f;background:#ffecec}.btn{border:0;background:#2869c4;color:#fff;font-weight:bold}.soft{border:0;background:#eaf2ff;color:#205797;font-weight:bold}.story{white-space:pre-wrap;font-size:19px;line-height:1.9;padding:16px;border:2px dashed #d4ac4e;background:#fffdf5;border-radius:14px}.meter{height:17px;background:#e3eaf3;border-radius:12px;overflow:hidden}.bar{height:100%;width:0;background:linear-gradient(90deg,#ffc144,#40a66e)}.hint{padding:11px;background:#fff6d2;border-left:5px solid #f7be38;border-radius:8px}.green{color:#208354;font-weight:bold}.red{color:#bd3a3a;font-weight:bold}.hidden{display:none}.tag{display:inline-block;background:#e8f2ff;color:#2864aa;padding:5px 10px;border-radius:20px;font-weight:bold}.copy{font-size:21px;line-height:2;background:#fff;padding:22px;border:1px solid #aaa}.count{font-size:19px;font-weight:bold}@media(max-width:600px){.wrap{padding:9px}.opt{min-height:55px}.story{font-size:18px}}
</style></head><body><header><h1>✍️ 四年級擴寫小作家</h1><div>自己一步一步擴寫，滿 200 字才能過關</div></header><div class="wrap">
<div class="card"><button class="btn" id="new">🎲 隨機抽題</button> <button class="soft" id="reset">↻ 重做本題</button><p>選擇符合情境的句子。錯誤的句子不能連接；完成六項基本擴寫後，如果還沒滿 200 字，就繼續進入「加強擴寫」。</p><div class="core" id="core">請先抽題</div></div>
<div class="card hidden" id="task"><span class="tag" id="level"></span><h2 id="title"></h2><div class="hint" id="hint"></div><div class="grid" id="opts"></div><p id="msg"></p></div>
<div class="card"><h2>🧩 我的文章</h2><div class="story" id="story">成功連接的內容會出現在這裡。</div><div class="meter"><div class="bar" id="bar"></div></div><p class="count" id="count">目前 0 / 200 字</p></div>
<div class="card hidden" id="finish"><h2>🎉 挑戰成功！</h2><p class="green">你自己完成了至少 200 字的擴寫，而且已經包含完整的敘事、描寫、事件與感受。</p><button class="btn" id="show">📖 作文簿抄寫模式</button> <button class="soft" id="copy">📋 複製全文</button><div class="copy hidden" id="copybox"></div></div>
</div><script>
const T=[
{c:'一顆足球滾了過來。',s:[['下課時，我和幾位同學來到操場上踢足球。','晚上睡覺時，我在棉被裡踢足球。'],['那顆黑白相間的足球轉得很快，還沾著幾片綠色的草屑。','足球聞起來像剛出爐的蛋糕，又甜又香。'],['我趕緊向前跑幾步，伸出右腳把球穩穩停住。','我張開翅膀飛到天空把足球抓住。'],['接著，我抬頭尋找隊友，看見同學正朝我揮手，於是把球傳了過去。','接著，我把足球放進鉛筆盒裡繼續寫字。'],['隊友順利接到球後，我們互相提醒位置，一起往球門的方向前進。','隊友接到球後，我們全部躺在操場上睡了一整天。'],['雖然跑得滿頭大汗，我還是很有成就感，也發現合作能讓比賽更順利。','我因此知道足球最好拿來煮湯。']],x:['我還注意到陽光照在球場上，大家的影子跟著奔跑的腳步不停移動，四周充滿加油聲。','沒想到對方突然把球攔走，我趕快轉身追上去，提醒自己不能因為一次失誤就放棄。','我大聲對隊友說：「這邊有空位！」隊友聽見後立刻把球傳來，我也專心做好接球準備。','最後，上課鐘聲響起，我們一起收好足球走回教室。這次活動讓我明白，運動除了技巧，也需要專心與合作。']},
{c:'一隻小狗跑到我面前。',s:[['星期日上午，我和家人到住家附近的公園散步。','我正在海底的教室裡等公車。'],['小狗有一身咖啡色的毛，脖子上掛著藍色項圈，尾巴不停擺動。','小狗是一枝透明的鉛筆，身上寫滿數學算式。'],['我停下腳步，沒有急著靠近，而是先觀察附近有沒有人正在找狗。','我立刻騎著小狗飛上天空繞地球一圈。'],['過了一會兒，我聽見遠處有人呼喊，原來主人正在四處尋找這隻小狗。','過了一會兒，小狗變成公車載著全班去上課。'],['我指向小狗所在的位置，讓正在尋找牠的人可以很快看見牠。','我把公園摺起來放進自己的口袋。'],['看到小狗安全回到主人身邊，我鬆了一口氣，也知道遇到陌生動物要先注意安全。','我因此知道所有小狗都會說國語。']],x:['小狗在草地旁來回走動，不時抬起頭看看四周，好像正在尋找熟悉的人。','我沒有追趕牠，只和牠保持適當距離，並提醒身旁的人不要突然大叫，以免嚇到牠。','找到小狗的主人向我道謝，我回答：「不用客氣，牠能平安回去就好。」','最後，我繼續和家人散步。這次特別的相遇讓我明白，想幫助動物時，冷靜觀察和注意安全都很重要。']},
{c:'天空突然下起大雨。',s:[['放學時，我背著書包走到學校門口，正準備回家。','我在沒有天空的海底等著下雨。'],['灰色的雲越來越厚，豆大的雨滴落在地面，發出急促的聲響。','雨滴變成香噴噴的炸雞在天空游泳。'],['我趕快走到屋簷下，拿出雨衣，也把作業收進書包裡。','我拿雨傘當鉛筆，在天空寫了一百個字。'],['路上很快出現小水窪，我放慢腳步，小心注意濕滑的地面。','我跳進最大的水窪，決定在馬路中央睡覺。'],['沒想到雨勢越來越大，我決定先在安全的地方等一等，再繼續前進。','雨越大，我就閉著眼睛在馬路上跑得越快。'],['雖然大雨打亂了原來的計畫，我卻明白遇到天氣改變時，安全比趕時間重要。','我學到下雨時完全不需要注意四周。']],x:['風把路旁的樹葉吹得不停搖晃，雨水沿著屋簷一滴接一滴落下，形成一道小小的水簾。','我看見同學也在躲雨，便提醒同學把雨衣穿好，不要因為急著回家就在濕滑的地方奔跑。','等候時，我心裡有一點著急，但看見雨勢慢慢變小後，就告訴自己耐心等待是比較安全的選擇。','最後，我平安回到家，也記得把濕雨衣晾好。這場大雨提醒我，平時準備雨具和注意天氣都很重要。']},
{c:'我收到一份神祕的禮物。',s:[['生日那天放學回家，我發現房間桌上放著一個包裹。','我在游泳池底點燃蠟燭看書。'],['盒子包著淡黃色的紙，上面繫著藍色緞帶，看起來十分特別。','盒子是一朵白雲，正在鍋子裡游泳。'],['我先看看小卡片，再小心解開緞帶，一層一層拆開包裝。','我把禮物從窗戶丟出去，再開始拆開。'],['打開盒子後，我看到一本精美的筆記本，第一頁還寫著鼓勵我的話。','打開盒子後，整間房子立刻飛到月球。'],['我反覆讀著卡片，發現準備禮物的人一定花了不少心思。','我把卡片吃掉，因為卡片看起來很好吃。'],['我十分驚喜，也發現值得珍惜的不只是物品本身，還有別人為我準備的心意。','我學到收到禮物完全不必向任何人道謝。']],x:['我用手輕輕摸著筆記本的封面，仔細看看每一頁，開始想像以後可以在裡面記錄哪些有趣的事情。','家人看見我仔細端詳禮物，便問我喜不喜歡。我笑著回答：「我很喜歡，而且會好好使用！」','我把拆下來的包裝紙整理好，也把小卡片留下來，因為卡片上的幾句話對我來說很有意義。','最後，我認真向準備禮物的人道謝。這份神祕禮物成了生日中很難忘的一段回憶，也提醒我要珍惜別人的心意。']},
{c:'一隻小鳥停在窗邊。',s:[['早自習前，我坐在教室裡整理抽屜，四周還很安靜。','我正在月球的海洋裡划船上課。'],['小鳥體型小巧，羽毛整齊，兩隻腳穩穩抓著窗沿。','小鳥其實是一張課桌，長著四個輪胎。'],['我放輕動作，只坐在原位安靜觀察，怕突然的聲音把牠嚇走。','我敲打玻璃並大聲尖叫，希望把小鳥嚇進教室。'],['小鳥歪著頭四處張望，偶爾輕啄窗邊，接著又跳了幾步。','小鳥拿出手機叫了一輛計程車去上班。'],['過了一會兒，牠張開翅膀，飛到不遠處的一根樹枝上。','過了一會兒，小鳥把整棟學校裝進書包。'],['短短的觀察讓我發現，平常生活中也有許多值得注意的小事，而且不打擾動物很重要。','我因此知道觀察動物一定要大聲追趕。']],x:['陽光從窗外照進來，樹葉在風中輕輕搖動，小鳥的身影在窗邊顯得特別清楚。','我很想更靠近看看，但又擔心驚動牠，所以提醒自己保持距離，只用眼睛仔細觀察。','同學走進教室時，我小聲說：「窗邊有一隻小鳥，我們不要嚇到牠。」大家也放輕了腳步。','最後，小鳥飛進樹葉之間，我也回到座位準備上課。這位短暫的訪客，讓平凡的早晨多了一段特別的回憶。']}
];
const names=['加入時間、地點與人物','加入具體描寫','加入人物動作','擴寫事情經過','加入更多發展','加入感受與想法'];const hints=['交代事情何時、何地發生。','寫出外形、顏色、聲音或樣子。','清楚寫出人物做了什麼。','讓事情依照先後順序發展。','加入新的變化，但要與前文相連。','寫出感受、想法或學到的事。'];
let t=null,step=0,parts=[],extras=[],extraIndex=0;const $=q=>document.querySelector(q);function n(s){return s.replace(/[\s，。！？、；：「」『』（）,.!?;:'"“”]/g,'').length}function upd(){let x=parts.join('
');$('#story').textContent=x||'成功連接的內容會出現在這裡。';let z=n(x);$('#count').textContent=`目前 ${z} / 200 字${z<200?'，還差 '+(200-z)+' 字':'，已達標！'}`;$('#bar').style.width=Math.min(100,z/2)+'%'}
function start(same=false){if(!same||!t)t=T[Math.floor(Math.random()*T.length)];step=0;parts=[t.c];extras=[...t.x].sort(()=>Math.random()-.5);extraIndex=0;$('#core').textContent='本次核心句：'+t.c;$('#task').classList.remove('hidden');$('#finish').classList.add('hidden');render();upd()}
function render(){if(step<6){$('#level').textContent=`基本擴寫 ${step+1}/6`;$('#title').textContent=names[step];$('#hint').textContent='💡 '+hints[step];let arr=[{v:t.s[step][0],ok:1},{v:t.s[step][1],ok:0}].sort(()=>Math.random()-.5);buttons(arr);return} if(n(parts.join(''))>=200){done();return} $('#level').textContent='加強擴寫';$('#title').textContent='文章還沒滿 200 字，再加入一個合理的細節';$('#hint').textContent='💡 可以加入景物、動作、對話、轉折、感受或結尾。你必須自己選到 200 字。';let good=extras[extraIndex%extras.length], bad=T[(T.indexOf(t)+1)%T.length].x[extraIndex%4];buttons([{v:good,ok:1},{v:bad,ok:0}].sort(()=>Math.random()-.5))}
function buttons(a){$('#opts').innerHTML='';$('#msg').textContent='';a.forEach(o=>{let b=document.createElement('button');b.className='opt';b.textContent=o.v;b.onclick=()=>pick(b,o);$('#opts').appendChild(b)})}
function pick(b,o){if(!o.ok){b.classList.add('bad');$('#msg').innerHTML='<span class="red">❌ 這一句和目前的主題或情境不合，不能連接。請再讀一次文章。</span>';setTimeout(()=>b.classList.remove('bad'),550);return}parts.push(o.v);$('#msg').innerHTML='<span class="green">✅ 通順，成功連接！</span>';[...$('#opts').children].forEach(x=>x.disabled=true);if(step<6)step++;else extraIndex++;upd();setTimeout(render,550)}
function done(){$('#task').classList.add('hidden');$('#finish').classList.remove('hidden');$('#copybox').textContent=parts.join('

');window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'})}
$('#new').onclick=()=>start(false);$('#reset').onclick=()=>t&&start(true);$('#show').onclick=()=>$('#copybox').classList.toggle('hidden');$('#copy').onclick=async()=>{try{await navigator.clipboard.writeText(parts.join('

'));$('#copy').textContent='✅ 已複製全文'}catch(e){$('#copybox').classList.remove('hidden')}};
</script></body></html>
